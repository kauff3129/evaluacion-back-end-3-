{% extends 'base.html' %}

{% block title %}Iniciar Sesión | IronGym{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card card-gym">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0">🔒 Acceso Administrativo IronGym</h4>
            </div>
            <div class="card-body p-4">
                {% if form.errors %}
                    <div class="alert alert-danger small">
                        Usuario o contraseña incorrectos. Inténtalo nuevamente.
                    </div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre de Usuario</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 fw-bold py-2">Ingresar al Sistema</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
